services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ayoos}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ayoos_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ayoos}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-postgres}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-ayoos_dev_password}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-ayoos_admin_dev_password}
    volumes:
      - ./infra/keycloak/realm-ayoos.json:/opt/keycloak/data/import/realm-ayoos.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8080"

  api:
    build:
      context: ./backend
      dockerfile: src/Ayoos.Api/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB:-ayoos};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-ayoos_dev_password}
      Keycloak__Authority: ${KEYCLOAK_AUTHORITY:-http://localhost:8081/realms/ayoos}
      Keycloak__MetadataAddress: ${KEYCLOAK_METADATA_ADDRESS:-http://keycloak:8080/realms/ayoos/.well-known/openid-configuration}
      Keycloak__Audience: ${KEYCLOAK_AUDIENCE:-ayoos-api}
      Keycloak__FrontendClientId: ${KEYCLOAK_FRONTEND_CLIENT_ID:-ayoos-frontend}
      Keycloak__AdminBaseUrl: ${KEYCLOAK_ADMIN_BASE_URL:-http://keycloak:8080}
      Keycloak__Realm: ${KEYCLOAK_REALM:-ayoos}
      Keycloak__AdminClientId: ${KEYCLOAK_ADMIN_CLIENT_ID:-ayoos-admin-api}
      Keycloak__AdminClientSecret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?KEYCLOAK_ADMIN_CLIENT_SECRET must be set in .env}
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    ports:
      - "5000:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000}
        NEXT_PUBLIC_KEYCLOAK_AUTHORITY: ${KEYCLOAK_AUTHORITY:-http://localhost:8081/realms/ayoos}
        NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: ${KEYCLOAK_FRONTEND_CLIENT_ID:-ayoos-frontend}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000}
      NEXT_PUBLIC_KEYCLOAK_AUTHORITY: ${KEYCLOAK_AUTHORITY:-http://localhost:8081/realms/ayoos}
      NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: ${KEYCLOAK_FRONTEND_CLIENT_ID:-ayoos-frontend}
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  postgres_data:
